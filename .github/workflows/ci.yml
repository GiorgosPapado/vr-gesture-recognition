name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install numpy scikit-learn pytest ruff
      - name: Lint
        run: ruff check dataset_v2 parity
      - name: Test (CPU only, synthetic data, no datasets required)
        run: python -m pytest -q dataset_v2
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install numpy pytest
          npm ci --prefix parity
      - name: Preprocessing parity (Python reference vs shipped JS engine)
        env:
          VRG_REQUIRE_JS: "1"
        run: python -m pytest -q parity
